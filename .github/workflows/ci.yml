name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - uses: extractions/setup-just@v4
      - name: Unit and transport tests
        run: just test
      - name: Static and asset checks
        run: just check
      - name: Native build
        run: just build
      - name: Native integration test against a child process
        run: just test-native
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: frida-mcp-linux-x86_64
          path: bin/frida-mcp
