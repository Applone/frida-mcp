name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtualenv
        run: uv venv --python ${{ matrix.python-version }}

      # frida ships large prebuilt wheels; the test suite mocks it entirely,
      # so we skip installing the package's runtime dependencies' heavy parts
      # and only fetch what tests need.
      - name: Install package and test dependencies
        run: |
          uv pip install -e . --no-deps
          uv pip install fastmcp pytest black

      - name: Check formatting
        run: uv run black --check src tests

      - name: Run tests
        run: uv run pytest tests -q

  build:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/frida-mcp-server
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Verify wheel contents
        run: uv run --with unzip unzip -l dist/*.whl

      - name: Publish to PyPI
        run: uv publish
