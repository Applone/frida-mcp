[build-system]
requires = ["uv_build>=0.8.0"]
build-backend = "uv_build"

[project]
name = "frida-mcp-server"
version = "0.2.0"
description = "Model Context Protocol implementation for Frida"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "frida>=16.0.0",
    "fastmcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "mypy",
    "pytest>=8.0",
]

[project.scripts]
frida-mcp-server = "frida_mcp.cli:main"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.uv.build-backend]
module-name = "frida_mcp"
